
[mgr]
sort_by = "natural"
linemode = "mtime"

[preview]
max_width = 600
max_height = 720
cache_dir = "~/.cache/yazi"
image_filter = "linear"


[opener]
edit = [
  { run = 'nvim %s', desc = "nvim", block = true, for = "unix" },
  { run = 'code %*', orphan = true, desc = "code", for = "windows" },
  { run = 'code -w %*', block = true, desc = "code (block)", for = "windows" },
]
image = [
  { run = 'imv %s', desc = "Open in imv" },
  # { run = '''exiftool "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
open = [
  { run = 'xdg-open "$1"', desc = "XDG Open", for = "linux" },
  { run = 'open %s', desc = "Open", for = "macos" },
  { run = 'start "" "%1"', orphan = true, desc = "Open", for = "windows" },
]
document = [
  { run = 'zathura %s', desc = "Zathura", orphan = true },
  { run = 'sioyek %s', desc = "Sioyek", orphan = true },
  { run = 'xournalpp %s', desc = "Xournal", orphan = true },
]
font = [
  { run = 'cp %s ~/.local/share/fonts/ && fc-cache -vf', desc = "Install font" },
]
reveal = [
  # { run = 'xdg-open "$(dirurl "$1")"',           desc = "XDG-Reveal", for = "linux" },
  { run = 'open -R "$1"', desc = "Reveal", for = "macos" },
  { run = 'explorer /select,"%1"', orphan = true, desc = "Reveal", for = "windows" },
  { run = '''exiftool "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
  { run = 'ya pub extract --list %s', desc = "Extract here", for = "unix" },
  { run = 'ya pub extract --list %*', desc = "Extract here", for = "windows" },
]
audio = [
  { run = 'mpv --no-video %s', orphan = true, for = "unix" },
  { run = 'mpv --no-video %*', orphan = true, for = "windows" },
  { run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
mpd = [
  { run = 'rmpc add "$(echo %s | sed -n -e "s/^.*joel\///p" | sed -n -e "s/^.*Music\///p")"; rmpc play', desc = "mpd" },
]
video = [
  { run = 'mpv --force-window %s', orphan = true, for = "unix" },
  { run = 'mpv --force-window %*', orphan = true, for = "windows" },
  { run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]
web = [
  { run = 'helium-browser %s', desc = "Helium" },
  { run = 'firefox %s', desc = "Firefox" },
]
xournalpp = [{ run = 'xournalpp %s', desc = "Xournal" }]

[open]
prepend_rules = [
  { url = "~/Music/*.{mp3,m4a,ogg}", use = [
    "mpd",
  ] },
  { url = "*.{epub,djvu,ps,cbr,cbz}", use = [
    "document",
    "reveal",
  ] },
  { url = "*.html", use = [
    "web",
    "edit",
  ] },
  { url = "*.xopp", use = [
    "xournalpp",
  ] },
]

append_rules = []

rules = [
  # Folder
  { url = "*/", use = [
    "edit",
    "image",
    "open",
    "reveal",
  ] },
  # Text
  { mime = "text/*", use = [
    "edit",
    "reveal",
  ] },
  #Document
  { mime = "application/{pdf,epub+zip}", use = [
    "document",
    "reveal",
  ] },
  { url = "*.djvu", use = [
    "document",
    "reveal",
  ] },
  # Image
  { mime = "image/{png,jpg,jpeg,heic,tiff,avif,jxl,gif}", use = [
    "image",
    "open",
    "reveal",
  ] },
  # Audio
  { mime = "{audio}/*", use = [
    "mpd",
    "audio",
    "reveal",
  ] },
  # Video
  { mime = "{video}/*", use = [
    "video",
    "reveal",
  ] },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [
    "extract",
    "reveal",
  ] },
  # JSON
  { mime = "application/{json,ndjson}", use = [
    "edit",
    "reveal",
  ] },
  { mime = "*/javascript", use = [
    "edit",
    "reveal",
  ] },
  # Empty file
  { mime = "inode/empty", use = [
    "edit",
    "reveal",
  ] },
  # Font
  { mime = "*{font,opentype,octet-stream}*", use = [
    "font",
    "reveal",
  ] },
  # Fallback
  { url = "*", use = [
    "open",
    "reveal",
  ] },
]

[plugin]
prepend_preloaders = [
  # Replace magick, image, video with mediainfo
  { mime = "{audio,video}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
  # Adobe Illustrator
  { mime = "application/postscript", run = "mediainfo" },
  # Epub
  { mime = "application/epub+zip", run = "epub-preview" },
  # Djvu
  { url = "*.{djv,djvu}", run = "djvu-view" },

  # 3d objects
  { url = "*.{3mf,obj,pts,ply,stl,step,stp}", run = "f3d-preview" },
]
prepend_previewers = [
  # Replace magick, image, video with mediainfo
  { mime = "{audio,video}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
  # Adobe Illustrator
  { mime = "application/postscript", run = "mediainfo" },
  # Epub
  { mime = "application/epub+zip", run = "epub-preview" },
  # Djvu
  { url = "*.{djv,djvu}", run = "djvu-view" },
  # Font
  { mime = "*{font,opentype}*", run = "font" },
  { url = "*{ttf,otf}", run = "font" },

  # 3d objects
  { url = "*.3mf", run = "f3d-preview" },
  { url = "*.obj", run = "f3d-preview" },
  { url = "*.pts", run = "f3d-preview" },
  { url = "*.ply", run = "f3d-preview" },
  { url = "*.stl", run = "f3d-preview" },
  { url = "*.step", run = "f3d-preview" },
  { url = "*.stp", run = "f3d-preview" },
]


[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
