# See https://wik.hypr.land/Configuring/Monitors/
monitor=eDP-1,preferred,auto,auto
# monitor=HDMI-A-1,preferred,auto,1.25
# monitor=DP-1,preferred,auto,1
# monitor=DP-2,1920x1200@60,auto,1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Some default env vars.
env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,BreezeX-RosePine-Linux
env = XCURSOR_SIZE, 24
env = TERM, foot
# env = EDITOR, nvim # Let .zshrc take care of this
$TERM=foot
# env = GTK_THEME, Tokyonight-Dark
# env = GTK2_RC_FILES, $HOME/.local/share/themes/Tokyonight-Dark/gtk-2.0/gtkrc
env = GTK_USE_PORTAL, 1
env = QT_QPA_PLATFORM, wayland
# env = QT_STYLE_OVERRIDE, kvantum
env = QT_QPA_PLATFORMTHEME, qt6ct
env = XDG_CONFIG_HOME, $HOME/.config
env = ZEIT_DB, $HOME/.local/share/zeit/zeit.db

# Execute your favorite apps at launch
exec-once = hyprpaper
exec-once = waybar
exec-once = pypr
exec-once = ydotoold
exec-once = kanshi
#exec = hyprpm reload -n
# exec-once = udiskie -s &
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch clipvault store # Forward text data
exec-once = wl-paste --type image --watch clipvault store # Forward raw image data
exec-once = clipvault clear
exec-once = hypridle
exec-once = $HOME/.config/userscripts/themeSetter.sh
exec-once = hyprsunset
exec-once = dunst
exec-once = /usr/lib/kdeconnectd
exec-once = kdeconnect-indicator
exec = kdeconnect-cli --refresh


# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant = ,querty
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = false
        middle_button_emulation = true
        drag_lock = true
        tap-and-drag = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

input:tablet{
  relative_input = true,
  left_handed = true,
}

gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device {
  name = epic-mouse-v1
  sensitivity = -0.5
}

device {
  name = Compx 2.4G Wireless Receiver
  kb_layout = us
  kb_options = altwin:swap_lalt_lwin
}

device {
  name = "Compx 2.4G Wireless Receiver Keyboard"
  kb_layout = us
  kb_options = altwin:swap_lalt_lwin
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    # gaps_in = 8
    # gaps_out = 22
    gaps_in = 4
    gaps_out = 6, 6, 8, 6
    border_size = 0
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    # resize_on_border = true

    layout = dwindle
    no_focus_fallback = false
}

decoration {
    rounding = 5

    # active_opacity = 0.95
    # inactive_opacity = 0.75

    blur{
      enabled = false
    # size = 3
    # passes = 2
    # new_optimizations = true
    # xray = true
    }

    shadow{
      enabled = false
    }

    dim_inactive = true
    dim_strength = 0.10
}

decoration:shadow{
    enabled = false
    range = 2
    render_power = 1
    color = rgba(1a1a1aee)
}

animations {
    enabled = true
    # first_launch_aniscmation = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 7, default, popin 90%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, default
}

dwindle {
  force_split = 2
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    # pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    #new_is_master = false
    orientation = right
}


debug{
  disable_logs = false
  gl_debugging = true
}

# Not supported anymore
# xwayland{
#   force_zero_scaling = false
# }

misc {
  # force_hypr_chan = true
  focus_on_activate = true
  allow_session_lock_restore = true
  middle_click_paste = false
  vrr = true
  # vfr = true
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}

plugin:hyprexpo{
    columns = 3
    gap_size = 5
    bg_col = rgb(111111)
    workspace_method = center current # [center/first] [workspace] e.g. first 1 or center m+1

    # enable_gesture = true # laptop touchpad
    # gesture_fingers = 3
    # gesture_distance = 300 # how far is the "max"
    # gesture_positive = false # positive = swipe down. Negative = swipe up.
}

# Special Keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
# Use 'mpc toggle', 'mpc next', and 'mpc prev' if not using mpDris2
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86Calculator, exec, wofi-calc

$mainMod = SUPER # For daily mundane tasks
$extraMod = SUPERSHIFT # For tasks which can can alter application processes
$moreMod = SUPERCTRL # For something little niche and specific
$advancedMod = SUPERSHIFTCTRL # For tasks which can alter window processes (more than single applications)
$godMod = SUPERSHIFTALTCTRL # For tasks which can alter system processes

# Essential application binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $TERM
# waybar
bind   =      , SUPER_L, exec, pkill -SIGUSR1 waybar
bindrt = SUPER, SUPER_L, exec, pkill -SIGUSR1 waybar
bind   =      , ALT_R, exec, pkill -SIGUSR1 waybar
#bind = $mainMod, grave, hyprexpo:expo, toggle
bind = $mainMod, E, exec, [float] $TERM yazi
bind = $mainMod, D, exec, wofi --exec-search --hide-scroll --insensitive --show=run --prompt=execute --columns=2
# bind = $mainMod, D, exec, rofi -no-lazy-grab -modi drun -show drun
# bind = $mainMod, M, exec, [float] $TERM 'mpc status| grep -E "playing|paused" || mpc clear; FZF_DEFAULT_COMMAND="fd -i -t file --base-directory /home/joel/Music/" fzf -m |mpc add && mpc play'
bind = $mainMod, SPACE, exec, ~/.config/userscripts/clipvault_wofi.sh
# bind = $mainMod, SPACE, exec, clipvault list|wofi --show=dmenu -p pastebin -G | clipvault get | wl-copy
# bind = $mainMod, SPACE, exec, clipvault list|rofi -dmenu -p pastebin -G| clipvault get | wl-copy
bind = $mainMod, C, exec, wofi-calc
bindl = $mainMod, A, exec, ~/.config/userscripts/audiochanger.py
bindl = $mainMod, O, exec, ~/.config/userscripts/zathura_history_wofi.sh
bindl = $mainMod, I, exec, playerctl play-pause
bindl = $extraMod, P, exec, hyprpicker -a

# Radio Controls
bindel = $mainMod, B, exec, rfkill unblock bluetooth && bluetoothctl connect $(cat $HOME/.Boult_Audio)
# bindl = $mainMod, W, exec, $HOME/workspace/networkmanager-dmenu/networkmanager_dmenu
bindl = $mainMod, W, exec, networkmanager_dmenu
bindl = $mainMod, V, exec, nmcli con up viper

bindl = $extraMod, K, exec, kdeconnect-cli --refresh
bindl = $moreMod, K, exec, kdeconnect-cli -n viper --send-clipboard


# rbw
bind = $moreMod, SPACE, exec, rofi-rbw -a copy --selector wofi --selector-args="--insensitive" --prompt Bitwarden --clear-after 30 --clipboarder wl-copy
bind = $advancedMod, SPACE, exec, rofi-rbw --selector wofi --selector-args="--insensitive" --prompt Bitwarden --typer ydotool

# dunst shortcuts
bind = $mainMod, N, exec, dunstctl close
bind = $mainMod, M, exec, dunstctl context
bind = $extraMod, N, exec, dunstctl close-all
bind = $extraMod, M, exec, dunstctl history-pop
bind = $extraMod, S, exec, ~/.config/userscripts/toggle-dnd.sh

# mako shortcuts
# bind = $mainMod, N, exec, makoctl dismiss
# bind = $extraMod, N, exec, makoctl dismiss -a
# bind = $extraMod, M, exec, makoctl restore
# bind = $mainMod, M, exec, makoctl menu wofi --demu
# bind = $extraMod, S, exec, ~/.config/userscripts/toggle-dnd.sh

bind = $mainMod, slash, exec, pypr toggle dropterm
bind = $mainMod, backslash, exec, pypr toggle ncspot
bind = $extraMod, slash, exec, hyprkeys -b -r|sed -E 's/^[a-z]+ = //g'|sed -E 's/^\$//g'|sed s/mainMod/SUPER/g|sed s/moreMod/SUPER\ CTRL/g|sed s/extraMod/SUPER\ SHIFT/g|sed s/advancedMod/SUPER\ SHIFT\ CTRL/g|sed s/godMod/SUPER\ SHIFT\ ALT\ CTRL/g|sed s/exec/=/g|wofi -d --prompt=binds

# Screenshots and Screenrecord
bindl =, Print, exec, ~/.config/userscripts/screenshot.sh
bindl = $mainMod, Print, exec, ~/.config/userscripts/screenrec.sh
bindl = $mainMod, P, exec, grim -o $(hyprctl monitors -j | jq -r '.[] | select(.focused)| .name') "/tmp/$(date +%Y.%m.%d-%H%M%S).jpg"
bind = , XF86SelectiveScreenshot, exec, grim -g "$(slurp)" - | wl-copy

bind = $extraMod, F, fullscreen,
# bind = $extraMod, V, togglesplit, # dwindle
#bind = $extraMod, P, pseudo, # dwindle
bind = $extraMod, SPACE, togglefloating,
bind = $extraMod, Q, killactive,
bindl = $extraMod, T, exec, ~/.config/userscripts/toggle-theme.sh
bindl = $extraMod, G, exec, ~/.config/userscripts/toggle-reading.sh
bindl = $extraMod, D, exec, ~/.config/userscripts/toggle-monitor.sh

bind = $advancedMod, E, exit
bind = $advancedMod, H, exec, ~/.config/userscripts/toggle-kanshi.sh
# bindl = $advancedMod, Q, exec, hyprctl kill && exec logout #Don't do this to unfuck screenlock. This will just kill hyprctl and leave the loginshell exposed
bind = $advancedMod, R, exec, hyprctl reload
# bindl = $advancedMod, L, exec, waylock -ignore-empty-password -fork-on-lock -init-color 0x3c3836 -input-color 0x458588 -fail-color 0xd93025
# bindl = $advancedMod, S, exec, waylock -ignore-empty-password -fork-on-lock -init-color 0x3c3836 -input-color 0x458588 -fail-color 0xd93025 & systemctl suspend
bindl = $advancedMod, L, exec, hyprlock --immediate
bindl = $advancedMod, S, exec, killall hyprlock & hyprlock --immediate & systemctl suspend

bind = $godMod, S, exec, shutdown now
bindl = $godMod, E, exec, loginctl terminate-session self #To prevent getting locked out from the lockscreen

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $extraMod, H, movewindow, l
bind = $extraMod, L, movewindow, r
bind = $extraMod, K, movewindow, u
bind = $extraMod, J, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# workspace to monitor bind
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1
workspace = 8, monitor:DP-2, default:true
workspace = 9, monitor:DP-2,
workspace = 10, monitor:DP-2,

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = , mouse:276, workspace, e+1
bind = , mouse:275, workspace, e-1
bind = $mainMod, mouse_up, workspace, e-1

# Scroll throught workspaces using keyboard
binde = $mainMod, right, workspace, e+1
binde = $mainMod, left, workspace, e-1
binde = $moreMod, h, workspace, e-1
binde = $moreMod, l, workspace, e+1

# Trigger when the switch is turning on.
bindl = , switch:on:[Lid Switch], exec, hyprctl keyword monitor "eDP-1, disable"
# Trigger when the switch is turning off.
bindl = , switch:off:[Lid Switch], exec, hyprctl keyword monitor "eDP-1, preferred, auto, 1.666667"

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, r, submap, resize
submap = resize
        binde = , l, resizeactive, 10 0
        binde = , h, resizeactive, -10 0
        binde = , j, resizeactive, 0 10
        binde = , k, resizeactive, 0 -10

        binde = , right, resizeactive, -10 0
        binde = , left, resizeactive, 10 0
        binde = , down, resizeactive, 0 10
        binde = , up, resizeactive, 0 -10
        
        bind = , Escape, submap, reset
submap = reset

bind=$mainMod, Escape, submap, nobinds
submap = nobinds
  bind=$mainMod, Escape, submap, reset
submap = reset

# WindowRules
windowrule = match:class confirm, float on
windowrule = match:class dialog, float on
windowrule = match:class download, float on
windowrule = match:class error, float on
windowrule = match:class file_progress, float on
windowrule = match:class notification, float on
windowrule = match:class splash, float on
windowrule = match:class dropterm, float on
windowrule = match:class imv, float on
windowrule = match:class Windscribe, float on
windowrule = match:class confirmreset, float on
windowrule = match:class Tor browser, float on
windowrule = match:class Pinentry-gtk-2, float on
windowrule = match:class (pinentry-)(.*), stay_focused on
windowrule = match:class gcr-prompter, stay_focused on
windowrule = match:class org.kde.kdeconnect.daemon, float on
windowrule = match:class org.kde.kdeconnect.handler, float on
windowrule = match:class org.kde.kdeconnect-indicator, float on
windowrule = match:class org.kde.kdeconnect.sms, float on
windowrule = match:title dropterm, float on
# windowrule = match:title dropterm, border_color rgb(ff00000)
windowrule = match:title ^(Wireshark.*Packet.*)$, float on
# windowrule = match:title (Yazi)(.*)$, no_screen_share on
windowrule = match:title ^(Export*)$, float on
windowrule = match:title ^(Export*), size 50% 50%

# windowrule = match:float on, size 50% 50%
# windowrule = match:float on, center on
# windowrule = match:float on, persistent_size off

# windowrule = match:namespace ^(wofi)$, no_screen_share on

# windowrule = opacity 0.4, class:foot
# windowrule = opaque, class:foot
windowrule = match:class firefox, idle_inhibit fullscreen
windowrule = match:class LibreWolf, idle_inhibit fullscreen
windowrule = match:class mpv, idle_inhibit focus
windowrule = match:class org.pwmt.zathura, workspace 2
windowrule = match:class firefox, workspace 5 silent
windowrule = match:class mpv, workspace 6
windowrule = match:title ^(ncmpcpp*), workspace 7


# firefox things
windowrule = match:title Open File, float on
windowrule = match:title Picture-in-Picture, float on
windowrule = match:title About Mozilla Firefox, float on
windowrule = match:title About LibreWolf, float on
windowrule = match:title Firefox — Sharing Indicator, float on
windowrule = match:title Picture-in-Picture, pin on
windowrule = match:title Picture-in-Picture, size 30% 30%
windowrule = match:title Picture-in-Picture, opacity 0.95 0.8
windowrule = match:title Picture-in-Picture, move 69.9% 64.5%
windowrule = match:title Firefox — Sharing Indicator, move 50% 0%
# windowrule = match:title ^(*Youtube*)$, idle_inhibit focus
windowrule = match:title Firefox — Sharing Indicator, suppress_event fullscreen
windowrule = match:title termfilechooser, float on
windowrule = match:initial_title termfilechooser, size 50% 50%

# windowrulev3 = nofullscreenrequest, class:firefox, title:^(Opening)*
# windowrulev2 = float, class:firefox, title:^(Opening)(.*)$
# windowrulev2 = size 50% 50%, class:firefox, title:*Save As*

# KDE CONNECT Presentation Mode
#windowrule=opacity 1, title:KDE Connect Daemon
windowrule = match:title KDEConnect Daemon, no_blur on
windowrule = match:title KDE Connect Daemon, border_size 0
windowrule = match:title KDE Connect Daemon, no_shadow on
#windowrule=noanim, title:KDE Connect Daemon
windowrule = match:title KDE Connect Daemon, no_focus on
windowrule = match:title KDE Connect Daemon, suppress_event fullscreen
windowrule= match:title KDE Connect Daemon, float on
#windowrule=pin, title:KDE Connect Daemon
windowrule = match:title KDE Connect Daemon, min_size 1366 768
#windowrule=move 0 0, title:KDE Connect Daemon

#windowrulev2 = move 25% 50%, initialTitle:dropterm
#windowrulev2 = size 50% 45%, initialTitle:dropterm
#windowrulev2 = move 25% 50%, org.kde.kdeconnect.handler, floating:true
#windowrulev2 = size 50% 45%, org.kde.kdeconnect.handler, floating:true

# App Launch shortcuts
bind = $mainMod, F1, exec, [float] $TERM
bind = $mainMod, F2, exec, zathura
bind = $mainMod, F4, exec, $TERM zsh -c yazi
bind = $mainMod, F5, exec, helium-browser
bind = $mainMod, F7, exec, [workspace 7] $TERM zsh -c rmpc

